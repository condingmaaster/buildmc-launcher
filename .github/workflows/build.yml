name: Build installers

# Builds the BuildMC Launcher: Windows 11 (NSIS .exe and WiX .msi) and Linux (.deb) and attaches them to a GitHub release.
# Start: push a tag like v0.4.3, or Actions -> Run workflow (then the files appear as workflow artifacts and in a draft release).
on:
  workflow_dispatch:
    inputs:
      nur_msix:
        description: "Nur das Store-Paket (.msix) bauen, keine Installer und kein Release"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.nur_msix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis,msi
          - os: ubuntu-22.04
            args: --bundles deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: BuildMC Launcher v__VERSION__
          releaseDraft: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

  # Store-Paket (.msix) fuer das Microsoft Partner Center. Unsigniert --
  # der Store signiert beim Einreichen selbst. Liegt danach als
  # Workflow-Artefakt "msix" am Lauf, nicht am Release: unsigniert laesst
  # es sich ausserhalb des Stores nicht installieren.
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: store
      - run: npm ci
      - name: Build (Store-Fassung)
        env:
          BUILDMC_STORE: "1"
        run: npx tauri build --no-bundle
      - name: Pack MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $id = Get-Content src-tauri/msix/identity.json -Raw | ConvertFrom-Json
          if (-not $id.name -or -not $id.publisher -or -not $id.publisherDisplayName) {
            throw "src-tauri/msix/identity.json ist unvollstaendig (Werte aus Partner Center -> Produktidentitaet)"
          }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version + ".0"
          $root = "msix-root"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item src-tauri/target/release/buildmc-launcher.exe $root
          Copy-Item -Recurse src-tauri/rust-editions "$root/rust-editions"
          Copy-Item -Recurse src-tauri/msix/Assets "$root/Assets"
          (Get-Content src-tauri/msix/AppxManifest.xml -Raw) `
            -replace "__NAME__", $id.name `
            -replace "__PUBLISHER__", [System.Security.SecurityElement]::Escape($id.publisher) `
            -replace "__PUBLISHER_DISPLAY__", [System.Security.SecurityElement]::Escape($id.publisherDisplayName) `
            -replace "__VERSION__", $version |
            Set-Content -Encoding utf8 "$root/AppxManifest.xml"
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d $root /p "BuildMC_Launcher_${version}_x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx fehlgeschlagen" }
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: "*.msix"
