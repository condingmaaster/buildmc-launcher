[package]
name         = "buildmc-launcher"
version      = "0.4.7"
edition      = "2021"
rust-version = "1.82"
description  = "BuildMC Launcher"
authors      = ["BuildMC"]

[lib]
name       = "buildmc_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

tokio   = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }

sha1    = "0.10"
md-5    = "0.10"
hex     = "0.4"
uuid    = { version = "1", features = ["v4", "v3", "serde"] }
zip     = { version = "2", default-features = false, features = ["deflate"] }
flate2  = "1"
tar     = "0.4"
sha2    = "0.10"

thiserror = "2"
dirs      = "5"
open      = "5"
sysinfo   = "0.32"
chrono    = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "s"
lto       = true
strip     = true
panic     = "abort"
